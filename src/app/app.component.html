<ion-app
  [attr.lang]="localization.currentLanguage()"
  [attr.dir]="localization.direction()"
  [class.language-switching]="localization.isSwitchingLanguage()"
>
  <ion-router-outlet></ion-router-outlet>

  <div
    class="auth-check-overlay"
    *ngIf="(isAuthReady$ | async) === false"
    aria-live="polite"
    aria-busy="true"
    role="status"
  >
    <div class="auth-check-surface">
      <ion-spinner name="crescent"></ion-spinner>
    </div>
  </div>

  <div
    class="language-switch-overlay"
    *ngIf="localization.isSwitchingLanguage()"
    aria-live="polite"
    aria-busy="true"
    role="status"
  >
    <div class="language-switch-surface">
      <ion-spinner name="crescent"></ion-spinner>
    </div>
  </div>
</ion-app>
