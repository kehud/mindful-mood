<ion-content class="home-content" fullscreen>
  <main class="home-shell">
    <header class="home-topbar">
      <div class="home-greeting">
        <svg class="home-greeting-mark" viewBox="0 0 54 34" aria-hidden="true">
          <path d="M4 23.5c6.4-6.2 12.7 5.9 19.1-.2 3.8-3.6 6.4-3.7 9-1.9" />
          <path d="M15.3 16.4c5 5.8 13.7 5.8 18.8 0" />
          <circle cx="10" cy="7.2" r="1.8" />
          <circle cx="25.8" cy="4.2" r="1.8" />
          <circle cx="39.7" cy="9.7" r="1.8" />
        </svg>

        <p>
          <span>{{ greetingTranslationKey | t }}</span>
          <span class="home-name" *ngIf="currentUserView$ | async as userView">
            <ng-container *ngIf="userView.resolved; else userNameSkeleton">
              <span class="reflect-reveal">{{ nameLead(userView.displayName) }}</span>
              <span class="home-name__accent reflect-reveal">{{ nameRest(userView.displayName) }}</span>
            </ng-container>

            <ng-template #userNameSkeleton>
              <span class="home-name__skeleton reflect-skeleton" aria-hidden="true"></span>
            </ng-template>
          </span>
        </p>
      </div>

      <ion-icon class="home-heart" name="heart-outline" aria-hidden="true"></ion-icon>
    </header>

    <section class="home-hero" aria-labelledby="home-heading">
      <h1 id="home-heading">{{ 'home.title' | t }}</h1>
      <p>{{ 'home.subtitle' | t }}</p>

      <div class="home-aura-cta">
        <span class="home-aura-layer home-aura-layer--one" aria-hidden="true"></span>
        <span class="home-aura-layer home-aura-layer--two" aria-hidden="true"></span>
        <span class="home-aura-layer home-aura-layer--three" aria-hidden="true"></span>
        <span class="home-aura-layer home-aura-layer--four" aria-hidden="true"></span>
        <span class="home-aura-layer home-aura-layer--five" aria-hidden="true"></span>
        <span class="home-aura-layer home-aura-layer--six" aria-hidden="true"></span>

        <ion-button class="home-checkin-action" fill="clear" routerLink="/check-in/mood">
          <span>{{ 'home.startCheckIn' | t }}</span>
          <ion-icon name="arrow-forward-outline" aria-hidden="true"></ion-icon>
        </ion-button>
      </div>
    </section>

    <a
      class="reflection-card"
      routerLink="/tabs/history"
      [class.reflection-card--loading]="isDailyReflectionLoading()"
      [attr.aria-busy]="isDailyReflectionLoading()"
    >
      <span *ngIf="!isDailyReflectionLoading(); else reflectionSkeleton" class="reflect-reveal">
        <strong>{{ dailyReflection().title }}</strong>
        <span>{{ dailyReflection().body }}</span>
      </span>

      <ng-template #reflectionSkeleton>
        <span class="reflection-card__skeleton" aria-hidden="true">
          <span class="reflect-skeleton reflect-skeleton-line reflect-skeleton-line--lg"></span>
          <span class="reflect-skeleton reflect-skeleton-line"></span>
        </span>
      </ng-template>

      <ion-icon name="chevron-forward-outline" aria-hidden="true"></ion-icon>
    </a>
  </main>
</ion-content>
