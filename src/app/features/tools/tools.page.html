<ion-content class="tools-content" fullscreen>
  <main class="tools-shell">
    <span class="tools-glow tools-glow--teal" aria-hidden="true"></span>
    <span class="tools-glow tools-glow--peach" aria-hidden="true"></span>
    <span class="tools-glow tools-glow--mint" aria-hidden="true"></span>

    <header class="tools-hero">
      <h1>{{ 'tabs.tools' | t }}</h1>
      <span>Support for your<br />mind and wellbeing.</span>
    </header>

    <section class="tools-grid" [attr.aria-label]="'tabs.tools' | t">
      <article
        class="tool-card"
        *ngFor="let tool of tools"
        [class.tool-card--teal]="tool.tone === 'teal'"
        [class.tool-card--peach]="tool.tone === 'peach'"
        [class.tool-card--violet]="tool.tone === 'violet'"
        [class.tool-card--plum]="tool.tone === 'plum'"
      >
        <span class="tool-card__icon" aria-hidden="true">
          <ion-icon [name]="tool.icon"></ion-icon>
        </span>

        <div>
          <h2>{{ tool.titleKey | t }}</h2>
          <p>{{ tool.subtitleKey | t }}</p>
        </div>
      </article>
    </section>
  </main>
</ion-content>
