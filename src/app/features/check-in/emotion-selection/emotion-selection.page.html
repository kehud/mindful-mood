<ion-content class="checkin-immersive-content" fullscreen>
  <main class="page-shell checkin-shell reflect-flow-shell mood-theme" [ngClass]="moodThemeClass(selectedMoodValue)">
    <nav class="checkin-nav">
      <ion-button class="nav-button" fill="clear" routerLink="/check-in/mood" [attr.aria-label]="'common.back' | t">
        <ion-icon slot="icon-only" name="chevron-back-outline"></ion-icon>
      </ion-button>
      <div class="flow-progress" [attr.aria-label]="'checkIn.progress' | t: { current: 2, total: 3 }">
        <span class="active"></span>
        <span class="active"></span>
        <span></span>
      </div>
      <ion-button class="nav-button" fill="clear" routerLink="/tabs/home" [attr.aria-label]="'common.cancel' | t">
        <ion-icon slot="icon-only" name="close-outline"></ion-icon>
      </ion-button>
    </nav>

    <ng-container *ngIf="emotionOptionsState$ | async as emotionConfig">
      <section class="selection-pane">
        <div class="config-loading" *ngIf="emotionConfig.loading && !emotionConfig.options.length" aria-live="polite">
          <ion-spinner name="crescent"></ion-spinner>
          <span>{{ 'checkIn.emotions.loading' | t }}</span>
        </div>

        <div class="selection-toolbar">
          <p class="selection-title">{{ 'checkIn.emotions.heading' | t }}</p>
          <p class="selection-subtitle">{{ 'checkIn.emotions.subtitle' | t }}</p>
        </div>

        <app-chip-selector
          class="emotion-chip-selector"
          [ariaLabel]="'checkIn.emotions.aria' | t"
          tone="mint"
          [options]="optionItems(displayedEmotionOptions(emotionConfig.options), currentLanguage())"
          [selectedValues]="selectedEmotions"
          (selectedValuesChange)="selectedEmotions = $event"
        ></app-chip-selector>

        <div class="show-more-row" *ngIf="shouldShowAllButton(emotionConfig.options)">
          <ion-button fill="clear" size="small" type="button" (click)="toggleShowAll()">
            {{ showAllToggleLabel(showAllEmotions) }}
          </ion-button>
        </div>
      </section>

      <footer class="bottom-action">
        <ion-button class="primary-action" expand="block" (click)="next()">
          <span>{{ 'common.next' | t }}</span>
          <ion-icon slot="end" name="arrow-forward-outline" aria-hidden="true"></ion-icon>
        </ion-button>
      </footer>
    </ng-container>
  </main>
</ion-content>
