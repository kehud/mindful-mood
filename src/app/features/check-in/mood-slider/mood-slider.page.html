<ion-content class="checkin-immersive-content" fullscreen>
  <ng-container *ngIf="moodOptionsState$ | async as moodConfig">
    <main
      class="page-shell checkin-shell reflect-flow-shell mood-theme mood-screen"
      *ngIf="selectedMood(moodConfig.options) as mood"
      [ngClass]="moodThemeClass(mood.value)"
    >
      <nav class="checkin-nav">
        <ion-button class="nav-button" fill="clear" routerLink="/tabs/home" [attr.aria-label]="'common.back' | t">
          <ion-icon slot="icon-only" name="chevron-back-outline"></ion-icon>
        </ion-button>
        <div class="flow-progress" [attr.aria-label]="'checkIn.progress' | t: { current: 1, total: 3 }">
          <span class="active"></span>
          <span></span>
          <span></span>
        </div>
        <ion-button class="nav-button" fill="clear" routerLink="/tabs/home" [attr.aria-label]="'common.cancel' | t">
          <ion-icon slot="icon-only" name="close-outline"></ion-icon>
        </ion-button>
      </nav>

      <section class="question-block mood-question">
        <h1>{{ 'checkIn.mood.heading' | t }}</h1>
        <p>{{ 'checkIn.mood.subtitle' | t }}</p>
      </section>

      <div class="config-loading" *ngIf="moodConfig.loading && !moodConfig.options.length" aria-live="polite">
        <ion-spinner name="crescent"></ion-spinner>
        <span>{{ 'checkIn.mood.loading' | t }}</span>
      </div>

      <section class="mood-stage" [attr.aria-label]="'checkIn.mood.selected' | t: { mood: (mood | configLabel) }">
        <div class="mood-aura mood-bloom mood-bloom--large" [ngClass]="moodBloomClass(mood.value)" aria-hidden="true">
          <span class="aura-layer aura-layer--1"></span>
          <span class="aura-layer aura-layer--2"></span>
          <span class="aura-layer aura-layer--3"></span>
          <span class="aura-layer aura-layer--4"></span>
          <span class="aura-layer aura-layer--5"></span>
          <span class="aura-layer aura-layer--6"></span>
          <span class="aura-core"></span>
          <span class="aura-spark aura-spark--1"></span>
          <span class="aura-spark aura-spark--2"></span>
        </div>

        <h2 aria-live="polite">{{ mood | configLabel }}</h2>

        <div class="mood-range-wrap">
          <ion-range
            class="mood-range"
            [attr.aria-label]="'checkIn.mood.aria' | t"
            [attr.aria-valuetext]="mood | configLabel"
            mode="ios"
            [min]="moodRangeMin(moodConfig.options)"
            [max]="moodRangeMax(moodConfig.options)"
            step="1"
            [snaps]="true"
            [ticks]="true"
            [(ngModel)]="moodLevel"
            (ionInput)="previewMood($event, moodConfig.options)"
            (ionChange)="snapMoodLevel(moodConfig.options)"
          ></ion-range>

          <div class="range-labels" [attr.aria-label]="'checkIn.mood.scale' | t">
            <span>{{ moodRangeLabel(moodConfig.options, 'start') }}</span>
            <span>{{ moodRangeLabel(moodConfig.options, 'end') }}</span>
          </div>

          <div class="mood-spectrum" aria-hidden="true"></div>
        </div>
      </section>

      <footer class="bottom-action">
        <ion-button class="primary-action" expand="block" (click)="next(moodConfig.options)">
          <span>{{ 'common.continue' | t }}</span>
          <ion-icon slot="end" name="arrow-forward-outline" aria-hidden="true"></ion-icon>
        </ion-button>
      </footer>
    </main>
  </ng-container>
</ion-content>
