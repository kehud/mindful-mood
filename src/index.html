<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8" />
  <title>Mindful Mood</title>

  <base href="/" />

  <meta name="color-scheme" content="light dark" />
  <meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

  <script>
    (function () {
      try {
        var storedTheme = localStorage.getItem('mindful-mood-theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var useDarkTheme = storedTheme === 'dark' || (storedTheme !== 'light' && prefersDark);

        document.documentElement.classList.toggle('ion-palette-dark', useDarkTheme);
        document.documentElement.style.colorScheme = useDarkTheme ? 'dark' : 'light';

        var storedLanguage = localStorage.getItem('mindful-mood-language');
        var browserLanguage = navigator.language && navigator.language.toLowerCase();
        var useHebrew = storedLanguage === 'he' || (storedLanguage !== 'en' && browserLanguage && browserLanguage.indexOf('he') === 0);
        var language = useHebrew ? 'he' : 'en';
        var direction = useHebrew ? 'rtl' : 'ltr';

        document.documentElement.lang = language;
        document.documentElement.dir = direction;
        document.documentElement.classList.toggle('app-rtl', useHebrew);
        document.documentElement.classList.toggle('app-ltr', !useHebrew);
      } catch (error) {
        document.documentElement.style.colorScheme = 'light dark';
      }
    })();
  </script>

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
</head>

<body>
  <app-root></app-root>
</body>

</html>
